<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}Тесты для аккредитации{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400..700&display=swap">
  <link rel="stylesheet" href="/static/style.css?v={{ static_version }}">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <script src="/static/client-log.js?v={{ static_version }}"></script>
</head>
<body class="{% block body_class %}{% endblock %}">
{% if role %}
<header class="topbar">
  <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">✓</span><span class="brand-text">Тесты для аккредитации</span></a>
  <nav aria-label="Разделы">
    <a href="/" {% if nav == 'tests' %}aria-current="page"{% endif %}>Все тесты</a>
    {% if role == 'admin' %}<a href="/admin" {% if nav == 'admin' %}aria-current="page"{% endif %}>Админка</a>{% endif %}
    <form method="post" action="/logout"><button class="link" type="submit">Выйти</button></form>
  </nav>
</header>
{% endif %}
<main>
{% block content %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
