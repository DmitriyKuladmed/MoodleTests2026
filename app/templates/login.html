{% extends "base.html" %}
{% block title %}Вход — Тесты для аккредитации{% endblock %}
{% block body_class %}login-body{% endblock %}
{% block content %}
<div class="login sheet">
  <div class="login-bubbles" aria-hidden="true"><span></span><span class="on"></span><span></span><span></span></div>
  <h1>Тесты для аккредитации</h1>
  <p>Логин и пароль — у администратора.</p>
  {% if error %}<div class="alert alert-error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label class="field"><span>Логин</span>
      <input type="text" name="login" value="{{ login or '' }}" autocomplete="username" autocapitalize="off" spellcheck="false" required autofocus>
    </label>
    <label class="field"><span>Пароль</span>
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button class="btn btn-primary btn-big" type="submit">Войти</button>
  </form>
</div>
{% endblock %}
