services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      SECURE_COOKIES: "true"
    volumes:
      - app_data:/data
    # Потолок памяти: обычно приложению хватает ~50 МБ, запас — на выгрузку большого архива.
    mem_limit: 500m
    memswap_limit: 500m

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Укажите DOMAIN в .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    mem_limit: 200m
    memswap_limit: 200m

volumes:
  app_data:
  caddy_data:
  caddy_config:
