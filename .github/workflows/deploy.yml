name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      # Папка на сервере с git-клоном репозитория и файлом .env (.env на сервере не трогаем).
      APP_DIR: moodle-tests
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$SSH_HOST" ]; then
            echo "::warning::Секреты для деплоя не заданы — пропускаю деплой."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up SSH
        if: steps.check.outputs.skip != 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          # Ключ, скопированный в Windows, бывает с \r в конце строк — ssh такой ключ не читает.
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null || { echo "::error::SSH_PRIVATE_KEY не похож на приватный ключ"; exit 1; }
          cat > ~/.ssh/config <<EOF
          Host server
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking accept-new
            ConnectTimeout 25
            ServerAliveInterval 15
          EOF

      - name: Deploy
        if: steps.check.outputs.skip != 'true'
        run: |
          # Сервер бывает занят ботами, поэтому несколько попыток подключиться.
          for attempt in 1 2 3 4 5; do
            if ssh server "cd ~/$APP_DIR && git fetch --quiet origin main && git reset --hard origin/main && docker compose up -d --build --remove-orphans && docker image prune -f && docker compose ps"; then
              exit 0
            fi
            echo "Попытка $attempt не удалась, жду…"
            sleep 15
          done
          echo "::error::Не удалось задеплоить по SSH"
          exit 1
