name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      APP_DIR: moodle-tests
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$SSH_HOST" ]; then
            echo "::warning::Секреты для деплоя не заданы — пропускаю деплой."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'

      - name: Set up SSH
        if: steps.check.outputs.skip != 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          # Ключ, скопированный в Windows, бывает с \r в конце строк — ssh такой ключ не читает.
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null || { echo "::error::SSH_PRIVATE_KEY не похож на приватный ключ"; exit 1; }
          echo "Отпечаток ключа: $(ssh-keygen -l -f ~/.ssh/id_deploy)"
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host server\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n  BatchMode yes\n' \
            "$SSH_HOST" "$SSH_USER" "$SSH_PORT" > ~/.ssh/config

      - name: Build .env
        if: steps.check.outputs.skip != 'true'
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
          EDITOR_LOGIN: ${{ secrets.EDITOR_LOGIN || 'kafedra' }}
          EDITOR_PASSWORD: ${{ secrets.EDITOR_PASSWORD }}
          ADMIN_LOGIN: ${{ secrets.ADMIN_LOGIN || 'admin' }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          umask 077
          {
            printf 'DOMAIN=%s\n' "$DOMAIN"
            printf 'EDITOR_LOGIN=%s\n' "$EDITOR_LOGIN"
            printf 'EDITOR_PASSWORD=%s\n' "$EDITOR_PASSWORD"
            printf 'ADMIN_LOGIN=%s\n' "$ADMIN_LOGIN"
            printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD"
            printf 'SECRET_KEY=%s\n' "$SECRET_KEY"
          } > deploy.env

      - name: Upload code
        if: steps.check.outputs.skip != 'true'
        run: |
          ssh server "mkdir -p ~/$APP_DIR"
          git archive --format=tar HEAD | ssh server "tar -x -C ~/$APP_DIR"
          scp -q deploy.env "server:~/$APP_DIR/.env"
          ssh server "chmod 600 ~/$APP_DIR/.env"

      - name: Start
        if: steps.check.outputs.skip != 'true'
        run: |
          ssh server "cd ~/$APP_DIR && docker compose up -d --build --remove-orphans && docker image prune -f"
          sleep 10
          ssh server "cd ~/$APP_DIR && docker compose ps"
